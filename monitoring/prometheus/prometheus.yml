global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: bepnha-nginx
    static_configs:
      - targets: ["bepnha-nginx-exporter:9113"]

  - job_name: bepnha-mysql
    static_configs:
      - targets: ["bepnha-mysql-exporter:9104"]

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
