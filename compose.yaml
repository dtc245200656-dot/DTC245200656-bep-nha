name: bep-nha

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql -h 127.0.0.1 -u "$${MYSQL_USER}"
          -D "$${MYSQL_DATABASE}" -e "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  app:
    build:
      context: ./docker
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${MYSQL_DATABASE:?}
      DB_USER: ${MYSQL_USER:?}
      DB_PASSWORD: ${MYSQL_PASSWORD:?}
    volumes:
      - ./index.php:/var/www/html/recipe/index.php:ro
      - ./recipe.php:/var/www/html/recipe/recipe.php:ro
      - ./db.php:/var/www/html/recipe/db.php:ro
      - ./admin:/var/www/html/recipe/admin:ro
      - ./includes:/var/www/html/recipe/includes:ro
      - ./member:/var/www/html/recipe/member:ro
      - ./login.php:/var/www/html/recipe/login.php:ro
      - ./register.php:/var/www/html/recipe/register.php:ro
      - ./logout.php:/var/www/html/recipe/logout.php:ro
      - ./images:/var/www/html/recipe/images:ro
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  phpmyadmin:
    image: phpmyadmin:5-apache
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:80"
    environment:
      PMA_HOST: db
      PMA_PORT: "3306"
      UPLOAD_LIMIT: 64M
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql_data: